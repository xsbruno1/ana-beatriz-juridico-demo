services:
  - type: web
    name: ana-beatriz-juridico-demo
    runtime: static
    buildCommand: node build.mjs
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
